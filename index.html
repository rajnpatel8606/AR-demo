<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Test</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      color: white;
      font-size: 22px;
      margin-bottom: 10px;
      text-align: center;
    }

    p {
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      margin-bottom: 20px;
      text-align: center;
    }

    .viewer-container {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
      background: #2a2a4a;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    model-viewer {
      width: 100%;
      height: 100%;
    }

    model-viewer::part(default-ar-button) {
      display: none;
    }

    .ar-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: white;
      border: none;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .model-switch {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .model-switch button {
      background: rgba(255,255,255,0.1);
      color: white;
      border: 2px solid rgba(255,255,255,0.3);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    .model-switch button.active {
      background: #667eea;
      border-color: #667eea;
    }

    .status {
      background: rgba(0,0,0,0.5);
      color: white;
      padding: 15px;
      border-radius: 10px;
      font-size: 13px;
      max-width: 100%;
      text-align: center;
    }

    .status.success { background: #27ae60; }
    .status.error { background: #e74c3c; }
  </style>
</head>

<body>

  <h1>🧪 AR Test Page</h1>
  <p>Test with Google's model first, then try your burger</p>

  <div class="model-switch">
    <button id="btnGoogle" class="active" onclick="switchModel('google')">✅ Google Chair</button>
    <button id="btnBurger" onclick="switchModel('burger')">🍔 Your Burger</button>
  </div>

  <div class="viewer-container">
    <model-viewer
      id="viewer"
      src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
      ar
      ar-modes="scene-viewer webxr quick-look"
      camera-controls
      auto-rotate
      shadow-intensity="1"
      environment-image="neutral"
      exposure="1"
    >
    </model-viewer>
  </div>

  <button class="ar-button" id="arButton">
    📱 View in AR
  </button>

  <div class="status" id="status">
    Loading model...
  </div>

  <script>
    const modelViewer = document.getElementById('viewer');
    const arButton = document.getElementById('arButton');
    const status = document.getElementById('status');
    const btnGoogle = document.getElementById('btnGoogle');
    const btnBurger = document.getElementById('btnBurger');

    // Known working models for testing
    const models = {
      google: 'https://modelviewer.dev/shared-assets/models/Astronaut.glb',
      burger: 'food.glb'
    };

    let currentModel = 'google';

    function switchModel(type) {
      currentModel = type;
      modelViewer.src = models[type];
      
      btnGoogle.classList.toggle('active', type === 'google');
      btnBurger.classList.toggle('active', type === 'burger');
      
      status.textContent = 'Loading ' + (type === 'google' ? 'Google Astronaut' : 'Your Burger') + '...';
      status.className = 'status';
    }

    modelViewer.addEventListener('load', () => {
      status.textContent = '✅ Model loaded! Tap "View in AR" to test.';
      status.className = 'status success';
    });

    modelViewer.addEventListener('error', (e) => {
      status.textContent = '❌ Failed to load model. File might be missing or corrupted.';
      status.className = 'status error';
    });

    modelViewer.addEventListener('ar-status', (e) => {
      if (e.detail.status === 'failed') {
        status.textContent = '❌ AR failed! Check ARCore is installed & camera permission granted.';
        status.className = 'status error';
      } else if (e.detail.status === 'session-started') {
        status.textContent = '✅ AR is working!';
        status.className = 'status success';
      }
    });

    arButton.addEventListener('click', () => {
      if (modelViewer.canActivateAR) {
        status.textContent = 'Opening AR...';
        modelViewer.activateAR();
      } else {
        status.textContent = '❌ AR not supported. Make sure you\'re using Chrome.';
        status.className = 'status error';
      }
    });
  </script>

</body>
</html>
