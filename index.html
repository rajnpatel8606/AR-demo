<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Menu - Alt</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #111;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    model-viewer {
      width: 100%;
      flex: 1;
      min-height: 70vh;
    }

    /* Make default button very visible */
    model-viewer::part(default-ar-button) {
      background: #ff6b35;
      border-radius: 50px;
      padding: 15px 30px;
      font-size: 16px;
      font-weight: bold;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
    }

    .info {
      background: #1a1a1a;
      color: #888;
      text-align: center;
      padding: 15px;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <model-viewer
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
    ar
    ar-modes="scene-viewer"
    ar-scale="auto"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    alt="3D model"
  >
  </model-viewer>

  <div class="info">
    If AR button doesn't appear, open in Chrome
  </div>

</body>
</html>
