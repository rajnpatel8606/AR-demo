<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Menu</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    model-viewer {
      width: 100%;
      flex: 1;
    }

    /* Hide default button - we use custom */
    model-viewer::part(default-ar-button) {
      display: none;
    }

    .bottom-section {
      background: #111;
      padding: 20px;
      text-align: center;
    }

    .ar-btn {
      background: #ff6b35;
      color: white;
      border: none;
      padding: 18px 40px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px;
      width: 100%;
      max-width: 300px;
    }

    .debug {
      color: #666;
      font-size: 12px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="container">
    <model-viewer
      id="viewer"
      src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
      ar
      ar-modes="scene-viewer webxr quick-look"
      camera-controls
      auto-rotate
      shadow-intensity="1"
    >
    </model-viewer>

    <div class="bottom-section">
      <button class="ar-btn" id="arBtn">👆 View in Your Space</button>
      <div class="debug" id="debug">Loading...</div>
    </div>
  </div>

  <script>
    const viewer = document.getElementById('viewer');
    const btn = document.getElementById('arBtn');
    const debug = document.getElementById('debug');

    viewer.addEventListener('load', () => {
      debug.textContent = 'Model loaded ✓ | AR: ' + (viewer.canActivateAR ? 'Yes ✓' : 'No ✗');
    });

    viewer.addEventListener('error', () => {
      debug.textContent = 'Error loading model!';
    });

    btn.addEventListener('click', () => {
      if (viewer.canActivateAR) {
        viewer.activateAR();
      } else {
        alert('AR not available. Use Chrome browser.');
      }
    });
  </script>

</body>
</html>
