<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Test</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .title {
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 20px;
    }

    model-viewer {
      width: 100%;
      flex: 1;
      min-height: 400px;
      background-color: #202020;
    }

    model-viewer::part(default-ar-button) {
      background-color: #ff6b35;
      border-radius: 8px;
      border: none;
      color: white;
      font-weight: bold;
      padding: 12px 24px;
    }
  </style>
</head>

<body>

  <div class="title">🍔 AR Demo</div>

  <model-viewer 
    id="model"
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
    ar
    ar-modes="webxr scene-viewer quick-look"
    xr-environment
    camera-controls 
    touch-action="pan-y"
    auto-rotate
    shadow-intensity="1"
    alt="A 3D model"
  >
  </model-viewer>

</body>
</html>
