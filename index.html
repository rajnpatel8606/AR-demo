<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View in AR</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      text-align: center;
      padding: 20px;
      color: white;
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.8;
    }

    .viewer-container {
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1;
      background: radial-gradient(circle, #2a2a4a 0%, #1a1a2e 100%);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      margin: 10px 20px;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    model-viewer::part(default-ar-button) {
      display: none;
    }

    .ar-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
      color: white;
      border: none;
      padding: 18px 36px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      margin: 24px;
      box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4);
    }

    .ar-button:active {
      transform: scale(0.98);
    }

    .ar-button svg {
      width: 24px;
      height: 24px;
    }

    .instructions {
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      text-align: center;
      padding: 0 20px 30px;
    }

    .status {
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      margin: 10px;
      font-size: 14px;
      text-align: center;
    }
    .status.loading { background: #3498db; }
    .status.success { background: #27ae60; }
    .status.error { background: #e74c3c; }
  </style>
</head>

<body>

  <div class="header">
    <h1>🍔 Deluxe Burger</h1>
    <p>Tap & drag to rotate • Pinch to zoom</p>
  </div>

  <div class="viewer-container">
    <model-viewer
      id="viewer"
      src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
      ar
      ar-modes="scene-viewer webxr quick-look"
      camera-controls
      auto-rotate
      shadow-intensity="1"
      environment-image="neutral"
      exposure="1.2"
      ar-scale="fixed"
    >
    </model-viewer>
  </div>

  <button class="ar-button" id="arButton">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M3 4c0-.55.45-1 1-1h2V1H4C2.35 1 1 2.35 1 4v2h2V4zm0 16v-2H1v2c0 1.65 1.35 3 3 3h2v-2H4c-.55 0-1-.45-1-1zm18-16V4c0-.55-.45-1-1-1h-2V1h2c1.65 0 3 1.35 3 3v2h-2zm0 16c0 .55-.45 1-1 1h-2v2h2c1.65 0 3-1.35 3-3v-2h-2v2z"/>
      <path d="M12 6c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/>
    </svg>
    View in Your Space
  </button>

  <div id="status" class="status loading">Loading 3D model...</div>

  <p class="instructions">
    Point your camera at a flat surface like a table to place the model
  </p>

  <script>
    const modelViewer = document.getElementById('viewer');
    const arButton = document.getElementById('arButton');
    const status = document.getElementById('status');

    modelViewer.addEventListener('load', () => {
      status.textContent = '✅ Ready! Tap the button to view in AR';
      status.className = 'status success';
    });

    modelViewer.addEventListener('error', () => {
      status.textContent = '❌ Error loading model';
      status.className = 'status error';
    });

    modelViewer.addEventListener('ar-status', (e) => {
      if (e.detail.status === 'failed') {
        status.textContent = '❌ AR failed - check camera permission';
        status.className = 'status error';
      }
    });

    arButton.addEventListener('click', () => {
      if (modelViewer.canActivateAR) {
        modelViewer.activateAR();
      } else {
        status.textContent = '❌ Open in Chrome on Android or Safari on iPhone';
        status.className = 'status error';
      }
    });
  </script>

</body>
</html>
