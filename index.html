<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AR Demo</title>

  <!-- Model Viewer -->
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: white;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
    }

    /* BIG CLEAR AR BUTTON */
    model-viewer::part(ar-button) {
      background: black;
      color: white;
      padding: 16px 28px;
      font-size: 18px;
      border-radius: 12px;
      border: none;
    }
  </style>
</head>

<body>

<model-viewer
  src="food.glb"
  ar
  ar-modes="scene-viewer webxr quick-look"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  environment-image="neutral"
  exposure="1"
>
</model-viewer>

</body>
</html>
