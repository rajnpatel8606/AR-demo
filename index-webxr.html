<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Menu</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#fff}
    model-viewer{width:100%;height:100%;background:#fff;--poster-color:transparent}
    model-viewer::part(default-ar-button){display:none}
    .ar-button{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,#2d2d2d 0%,#1a1a1a 100%);color:#fff;border:none;padding:18px 36px;font-size:17px;font-weight:600;letter-spacing:.3px;border-radius:100px;cursor:pointer;box-shadow:0 8px 32px rgba(0,0,0,.25),0 2px 8px rgba(0,0,0,.15);transition:transform .2s ease,box-shadow .2s ease;z-index:100;-webkit-tap-highlight-color:transparent}
    .ar-button:hover{transform:translateX(-50%) translateY(-2px);box-shadow:0 12px 40px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.2)}
    .ar-button:active{transform:translateX(-50%) scale(.98)}
    .ar-button svg{width:22px;height:22px;flex-shrink:0}
    .ar-button[hidden]{display:none}
  </style>
</head>
<body>
  <model-viewer id="viewer" src="food.glb" ar ar-modes="scene-viewer webxr quick-look" ar-scale="auto" ar-placement="floor" camera-controls touch-action="pan-y" auto-rotate rotation-per-second="30deg" shadow-intensity="1" shadow-softness="1" exposure="1" environment-image="neutral" alt="3D Food Model"></model-viewer>
  <button class="ar-button" id="arButton">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
    View in your space
  </button>
  <script>
    const modelViewer=document.getElementById('viewer'),arButton=document.getElementById('arButton');
    modelViewer.addEventListener('load',()=>{if(!modelViewer.canActivateAR)arButton.hidden=true});
    arButton.addEventListener('click',()=>{modelViewer.activateAR()});
  </script>
</body>
</html>
