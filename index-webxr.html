<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Menu</title>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>

  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .title {
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 20px;
      background: #1a1a1a;
    }

    model-viewer {
      width: 100%;
      height: 60vh;   /* Smaller Viewer */
      background-color: #202020;
    }

    /* BIGGER AR BUTTON */
    model-viewer::part(default-ar-button) {
      background-color: #ff6b35;
      border-radius: 12px;
      border: none;
      color: white;
      font-weight: bold;
      padding: 20px 40px;
      font-size: 18px;
    }

    .instructions {
      color: #888;
      text-align: center;
      padding: 15px;
      font-size: 13px;
      background: #1a1a1a;
    }
  </style>
</head>

<body>

  <div class="title">🍔 AR Demo</div>

  <model-viewer 
    id="model"
    src="Samosa.glb"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto"
    ar-placement="floor"
    camera-controls
    interaction-prompt="auto"
    touch-action="pan-y"
    auto-rotate
    rotation-per-second="10deg"
    shadow-intensity="2"
    shadow-softness="0.8"
    exposure="1.9"
    environment-image="neutral"
    xr-environment
    alt="3D Food Model"
  >
    <!-- AR Prompt -->
    <div slot="ar-prompt" style="
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
    ">
      👆 Tap to place • Use two fingers to rotate
    </div>
  </model-viewer>

  <div class="instructions">
    Tap "View in AR" → Point at table → Tap to place → Drag to move
  </div>

</body>
</html>
