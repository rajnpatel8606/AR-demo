<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Menu</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .title {
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 20px;
      background: #1a1a1a;
    }

    model-viewer {
      width: 100%;
      flex: 1;
      min-height: 70vh;
      background-color: #202020;
    }

    model-viewer::part(default-ar-button) {
      background-color: #ff6b35;
      border-radius: 8px;
      border: none;
      color: white;
      font-weight: bold;
      padding: 14px 28px;
      font-size: 16px;
    }

    .instructions {
      color: #888;
      text-align: center;
      padding: 15px;
      font-size: 13px;
      background: #1a1a1a;
    }
  </style>
</head>

<body>

  <div class="title">🍔 AR Demo</div>

  <model-viewer 
    id="model"
    src="food.glb"
    ar
    ar-modes="webxr scene-viewer quick-look"
    aar-scale="fixed"
    scale="1 1 1"
    ar-placement="floor"
    camera-controls 
    touch-action="pan-y"
    auto-rotate
    shadow-intensity="1"
    shadow-softness="1"
    exposure="1.5"
    environment-image="neutral"
    skybox-image=""
    alt="A 3D model"
  >
    <div slot="ar-prompt" style="
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
    ">
      👆 Tap to place • Drag to move
    </div>
